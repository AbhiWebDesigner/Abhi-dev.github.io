<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABHI.DEV — Advanced</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --c:#00f5ff;
  --p:#bf00ff;
  --g:#ffd700;
  --o:#ff6b00;
  --dk:#030712;
}

body{
  background:var(--dk);
  color:#fff;
  font-family:'Rajdhani',sans-serif;
  overflow:hidden;
}

/* FIXED GRADIENT */
.gtext{
  background:linear-gradient(135deg,var(--c),var(--p));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
}

/* NAV */
#nav{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  z-index:1000;
}

.nav-btn{
  margin-left:10px;
  cursor:pointer;
}

/* PAGE SYSTEM */
.page{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  transition:0.4s;
}

.page.active{
  opacity:1;
}

/* TITLE */
.title{
  font-size:60px;
  font-family:'Orbitron';
}

/* BUTTON */
.btn{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  cursor:pointer;
  background:linear-gradient(135deg,var(--c),var(--p));
  color:#000;
}

/* CANVAS BG */
canvas{
  position:absolute;
  inset:0;
  z-index:-1;
}
</style>
</head>

<body>

<!-- NAV -->
<div id="nav">
  <div class="gtext title" style="font-size:20px">ABHI.DEV</div>
  <div>
    <span class="nav-btn" onclick="go(0)">Home</span>
    <span class="nav-btn" onclick="go(1)">About</span>
    <span class="nav-btn" onclick="go(2)">AI</span>
  </div>
</div>

<!-- PAGES -->

<div class="page active" id="p0">
  <canvas id="c1"></canvas>
  <h1 class="title gtext">WELCOME</h1>
  <button class="btn" onclick="go(1)">Next</button>
</div>

<div class="page" id="p1">
  <h1 class="title gtext">ABOUT</h1>
  <p>UI/UX • AI • Web</p>
  <button class="btn" onclick="go(2)">Next</button>
</div>

<div class="page" id="p2">
  <h1 class="title gtext">AI SYSTEM</h1>
  <p>Auto Reply + Smart Bot Ready</p>
</div>

<script>

/* PAGE SYSTEM */
let cur=0;
const pages=document.querySelectorAll('.page');

function go(n){
  pages[cur].classList.remove('active');
  cur=n;
  pages[cur].classList.add('active');
}

/* CANVAS ANIMATION */
const c=document.getElementById('c1');
const ctx=c.getContext('2d');

function resize(){
  c.width=window.innerWidth;
  c.height=window.innerHeight;
}
resize();
window.onresize=resize;

let particles=[];
for(let i=0;i<120;i++){
  particles.push({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    r:Math.random()*2,
    s:Math.random()*1
  });
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  particles.forEach(p=>{
    ctx.fillStyle="rgba(0,245,255,0.7)";
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();

    p.y-=p.s;
    if(p.y<0){
      p.y=c.height;
      p.x=Math.random()*c.width;
    }
  });

  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
